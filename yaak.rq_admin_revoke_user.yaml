description: |-
  Revokes ALL of a user's refresh tokens, forcing them to log in again everywhere. Implemented via a per-user revocation epoch.

  Note: already-issued access JWTs remain valid until they expire (~15m).

  Requires ADMIN or SUPER_ADMIN.
