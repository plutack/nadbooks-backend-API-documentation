  {
    "users": { "total": 0, "verified": 0, "active": 0, "admins": 0 },
    "books": { "total": 0, "deleted": 0, "pendingReview": 0, "approved": 0, "rejected": 0 },
    "orders": { "total": 0, "PENDING": 0, "PAID": 0, "COMPLETED": 0, "FAILED": 0, "CANCELLED": 0 },
    "transactions": { "total": 0, "PENDING": 0, "SUCCESS": 0, "FAILED": 0 },
