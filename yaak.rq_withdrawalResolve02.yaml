description: |-
  #### Resolve Bank Account

  Verify a Nigerian bank account and get the account holder's name. Used to confirm account details before initiating a withdrawal.

  - **Endpoint**: `GET /withdrawal/resolve-bank`
  - **Access**: Authenticated (JWT Bearer Token)

  ##### Query Parameters

  | Field           | Type     | Required | Description                |
  | :-------------- | :------- | :------- | :-------------------------- |
  | `accountNumber` | `string` | Yes      | Nigerian account number     |
  | `bankCode`      | `string` | Yes      | Nigerian bank code (e.g., 058) |

  ##### Response Example
  ```json
  {
    "accountName": "John Doe"
  }
  ```

  ##### Error Responses
  - 400: Invalid account number or bank code
  - 401: Unauthorized (missing/invalid JWT)
