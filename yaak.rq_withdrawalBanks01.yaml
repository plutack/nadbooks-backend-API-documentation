description: |-
  #### Get List of Nigerian Banks

  Returns a list of Nigerian banks with their names and codes for populating withdrawal dropdowns.

  - **Endpoint**: `GET /withdrawal/banks`
  - **Access**: Public

  ##### Response Example
  ```json
  {
    "banks": [
      { "name": "Guarantee Trust Bank", "code": "058" },
      { "name": "First Bank of Nigeria", "code": "011" }
    ]
  }
  ```

  **Note**: This endpoint is cached for 24 hours to improve performance.
