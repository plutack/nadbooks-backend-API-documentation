description: |-
  Set a transaction PIN for the authenticated user. Requires email verification to be complete first.

  #### Request Body

  | Field | Type   | Required | Description                           |
  | :---- | :----- | :------- | :----------------------------------- |
  | `pin` | `string` | Yes    | 6-digit PIN (e.g., "123456")        |

  #### Response Example

  ```json
  {
    "statusCode": 200,
    "message": "Success",
    "errors": null,
    "data": {
      "message": "Transaction PIN set successfully"
    }
  }
  ```

  #### Error Responses

  - 400: Email verification required before setting PIN
  - 409: PIN already set (use /pin/change instead)
