description: |-
  Request a transaction PIN reset code to be sent to the user's email.

  #### Request Body

  | Field  | Type   | Required | Description                           |
  | :----- | :----- | :------- | :----------------------------------- |
  | `email` | `string` | Yes    | User's email address                  |

  #### Response Example

  ```json
  {
    "message": "PIN reset code sent"
  }
  ```

  #### Error Responses

  - 404: User not found
  - 400: Email verification required before resetting PIN
  - 429: Too many requests (5 min cooldown)
