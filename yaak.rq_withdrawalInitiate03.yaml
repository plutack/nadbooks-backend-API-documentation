bodyType: application/json
description: |-
  #### Initiate a Withdrawal

  Withdraw BOOKS tokens to a bank account (Paystack) or crypto wallet.

  - **Endpoint**: `POST /withdrawal`
  - **Access**: Authenticated (JWT Bearer Token)

  ##### Body Parameters (Common)

  | Field   | Type   | Required | Description                        |
  | :------ | :----- | :------- | :---------------------------------- |
  | `amount` | `number` | Yes     | Amount to withdraw in BOOKS        |
  | `method` | `string` | Yes     | `PAYSTACK` or `CRYPTO`             |
  | `pin`    | `string` | Yes     | 6-digit transaction PIN             |

  ##### Body Parameters (Paystack)

  | Field           | Type   | Required | Description                     |
  | :-------------- | :----- | :------- | :------------------------------ |
  | `accountNumber` | `string` | Yes     | Nigerian bank account number    |
  | `accountName`   | `string` | Yes     | Account holder name             |
  | `bankCode`      | `string` | Yes     | Nigerian bank code              |

  ##### Body Parameters (Crypto)

  | Field          | Type   | Required | Description              |
  | :------------- | :----- | :------- | :---------------------- |
  | `walletAddress` | `string` | Yes    | Recipient crypto wallet |

  ##### Response Example
  ```json
  {
    "hash": "tst_abc123xyz"
  }
  ```

  ##### Error Responses

  - 400: Insufficient balance, invalid PIN, or validation error
  - 401: Unauthorized
  - 429: Too many failed PIN attempts (15 min lockout)
