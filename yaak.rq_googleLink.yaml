bodyType: application/json
description: |-
  Link a Google account to an authenticated user.

  #### Auth: Requires JWT `accessToken` in Authorization header

  #### Validation:
  - User must have a password set (cannot link if Google is only auth)
  - Google account email must match authenticated user's email
  - Google account cannot already be linked to another user

  #### Request Body
  | Field  | Type   | Required | Description                    |
  | :----- | :----- | :------- | :---------------------------- |
  | `token` | `string` | Yes     | Google ID token (credential) |

  #### Response Example
  ```json
  {
    "message": "Google account linked successfully",
    "user": {
      "id": "uuid",
      "username": "johndoe",
      "firstName": "John",
      "lastName": "Doe",
      "email": "john@example.com",
      "role": "USER",
      "googleId": "google-sub-id"
    }
  }
  ```

  #### Error Responses
  - 400: Google email doesn't match user email
  - 409: Google account already linked or linked to another user
