bodyType: application/json
description: |-
  Change the authenticated user's password. Requires current password verification. Returns new tokens.

  #### Request Body

  | Field            | Type   | Required | Description                           |
  | :--------------- | :----- | :------- | :----------------------------------- |
  | `currentPassword` | `string` | Yes     | User's current password.             |
  | `newPassword`    | `string` | Yes     | New password (min 8 chars, uppercase, lowercase, number, special char). |

  #### Response Example

  ```json
  {
    "accessToken": "eyJ...",
    "refreshToken": "uuid...",
    "user": {
      "id": "uuid",
      "username": "johndoe",
      "firstName": "John",
      "lastName": "Doe",
      "email": "john@example.com",
      "role": "USER"
    }
  }
  ```

  **Note:** Store the new tokens in localStorage after a successful response.
