bodyType: application/json
description: |-
  Authenticate with a Google One Tap ID token (credential).

  #### Flow:
  1. Frontend: `window.google.accounts.id.initialize()` + `window.google.accounts.id.prompt()` or `renderButton()`
  2. Google returns `credential` in callback
  3. Send `{ token: credential }` here

  #### Backend:
  - Verifies token via `google-auth-library`
  - Creates user if new, updates `googleId` if exists
  - Issues own JWT (`accessToken`, `refreshToken`)

  #### Request Body
  | Field  | Type   | Required | Description                    |
  | :----- | :----- | :------- | :---------------------------- |
  | `token` | `string` | Yes     | Google ID token (credential) |

  #### Response Example
  ```json
  {
    "accessToken": "eyJ...",
    "refreshToken": "uuid...",
    "user": {
      "id": "uuid",
      "username": "johndoe",
      "firstName": "John",
      "lastName": "Doe",
      "email": "john@example.com",
      "role": "USER",
      "googleId": "google-sub-id"
    }
  }
  ```
