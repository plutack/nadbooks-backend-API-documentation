bodyType: application/json
description: |-
  Confirm a transaction PIN reset with the code sent to email. Sets a new PIN.

  #### Request Body

  | Field    | Type   | Required | Description                           |
  | :-------- | :----- | :------- | :----------------------------------- |
  | `email`  | `string` | Yes     | User's email address                 |
  | `code`   | `string` | Yes     | 6-digit reset code from email        |
  | `newPin` | `string` | Yes     | New 6-digit PIN                       |

  #### Response Example

  ```json
  {
    "message": "Transaction PIN reset successfully"
  }
  ```

  #### Error Responses

  - 400: Reset code expired or not found
  - 401: Invalid reset code
