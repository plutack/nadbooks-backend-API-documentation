description: |-
  Unlink Google account from an authenticated user.

  #### Auth: Requires JWT `accessToken` in Authorization header

  #### Validation:
  - User must have a password set (use set-password endpoint first)
  - Google account must be currently linked

  #### Response Example
  ```json
  {
    "message": "Google account unlinked successfully"
  }
  ```

  #### Error Responses
  - 400: No Google account linked OR no password set
