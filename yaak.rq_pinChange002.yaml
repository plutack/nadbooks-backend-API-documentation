description: |-
  Change the user's transaction PIN. Requires the current PIN.

  #### Request Body

  | Field     | Type   | Required | Description                           |
  | :-------- | :----- | :------- | :----------------------------------- |
  | `oldPin` | `string` | Yes     | Current 6-digit PIN                   |
  | `newPin` | `string` | Yes     | New 6-digit PIN                       |

  #### Response Example

  ```json
  {
    "message": "Transaction PIN changed successfully"
  }
  ```

  #### Error Responses

  - 400: PIN not set (use /pin/set first)
  - 400: Invalid current PIN
