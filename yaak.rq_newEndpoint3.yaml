description: |-
  Set a password for users who logged in via social (no password). This allows them to also login with email/password.

  #### Request Body

  | Field     | Type   | Required | Description                           |
  | :-------- | :----- | :------- | :----------------------------------- |
  | `password` | `string` | Yes    | Password (min 8 chars, uppercase, lowercase, number, special char). |

  #### Response Example

  ```json
  {
    "message": "Password set successfully"
  }
  ```

  #### Error Responses

  - 400: If user already has a password.
